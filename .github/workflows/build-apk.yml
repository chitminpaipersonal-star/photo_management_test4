name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Auto Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb7434029502224e8d80\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c241d8c1f757b86af09d7f6c17439d40\n621085764034346bb68c4d29fe341e0506aa9f4c" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c241d8c1f757b86af09d7f6c17439d40" > "$ANDROID_HOME/licenses/android-googletv-license"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Prepare Capacitor Android Platform
        run: |
          # If android folder is missing or incomplete, add platform automatically
          if [ ! -d "android" ] || [ ! -f "android/build.gradle" ]; then
            echo "android/ platform missing or incomplete. Adding via Capacitor..."
            npx cap add android
          fi

          # Sync built web assets and native plugins into android project
          npx cap sync android

          # Ensure compileSdkVersion is 35 (Android 15) for GitHub runner preinstalled SDK compatibility
          if [ -f "android/variables.gradle" ]; then
            sed -i 's/compileSdkVersion = 36/compileSdkVersion = 35/g' android/variables.gradle
            sed -i 's/targetSdkVersion = 36/targetSdkVersion = 35/g' android/variables.gradle
          fi

      - name: Build APK with Gradle
        run: |
          cd android
          # Run assembleDebug via gradlew if present, or directly via installed Gradle 8.14.3
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            echo "gradlew script not found, building directly with Gradle 8.14.3..."
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Verify Generated APK
        run: |
          ls -la android/app/build/outputs/apk/debug/
          APK_COUNT=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "Error: No APK file was generated."
            exit 1
          fi
          echo "Successfully generated APK(s):"
          find android/app/build/outputs/apk/debug/ -name "*.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DataManagement-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
