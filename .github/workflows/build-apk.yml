name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Auto Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Prepare Capacitor Android Platform
        run: |
          # If android folder is missing from the repository, add platform automatically
          if [ ! -d "android" ]; then
            echo "android/ directory not found in repository. Adding Android platform via Capacitor..."
            npx cap add android
          fi

          # Sync built web assets and native plugins into android project
          npx cap sync android

      - name: Ensure Gradle Wrapper and Executable Permissions
        run: |
          # Verify gradlew and wrapper jar exist; if missing, install gradle and generate wrapper
          if [ ! -f "android/gradlew" ] || [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "android/gradlew or gradle-wrapper.jar missing. Generating gradle wrapper..."
            sudo apt-get update && sudo apt-get install -y gradle
            cd android
            gradle wrapper --gradle-version 8.11.1 || gradle wrapper
            cd ..
          fi

          chmod +x android/gradlew
          ls -la android/gradlew
          ls -la android/gradle/wrapper/

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Verify Generated APK
        run: |
          ls -la android/app/build/outputs/apk/debug/
          APK_COUNT=$(find android/app/build/outputs/apk/debug/ -name "*.apk" | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "Error: No APK file was generated."
            exit 1
          fi
          echo "Successfully generated APK(s):"
          find android/app/build/outputs/apk/debug/ -name "*.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DataManagement-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
